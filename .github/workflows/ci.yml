name: API Test & Allure Report

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted  
    permissions:
      contents: write

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4



      - name: 2. 安装依赖
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pyyaml allure-pytest

      - name: 3. 运行测试
        shell: cmd
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: |
          pytest --alluredir=./allure-results

      
      - name: 4. 生成 Allure 报告
        shell: cmd
        if: always()
        run: |
          "C:\Users\admin\Downloads\allure-commandline-2.46.1\allure-2.46.1\bin\allure.bat" generate ./allure-results -o ./allure-history --clean
          

      - name: 5. 发布报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-history