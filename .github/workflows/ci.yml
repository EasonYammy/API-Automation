name: API Test & Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写权限来发布 Allure 报告到 gh-pages

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pyyaml allure-pytest

      - name: 4. 运行测试并生成 Allure 结果
        env:
          # 把 Secrets 注入到环境变量中
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          pytest --alluredir=./allure-results

      - name: 5. 生成 Allure 报告
        uses: simple-elf/allure-report-action@v1.15
        if: always() # 即使测试失败，也生成报告
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages

      - name: 6. 发布报告到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history